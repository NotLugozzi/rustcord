[workspace]
resolver = "2"
members = [
    "crates/rustcord-client",
    "crates/rustcord-ui",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true

[profile.dev.package."*"]
opt-level = 2

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
