[package]
name = "rustcord-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "1"
tracing = "0.1"
flate2 = "1"
wry = "0.57"
tao = "0.37"
openmls = { path = "../openmls" }
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
openmls_basic_credential = "0.6.0"
tls_codec = "0.5"
str0m = "0.24.1"
cpal = { version = "0.18", features = ["pulseaudio"] }
audiopus = "0.3.0-rc.0"
nnnoiseless = "0.5"
aes = "0.8"
ghash = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
ashpd = { version = "0.13", features = ["screencast"], optional = true }
pipewire = { version = "0.10", optional = true }
libspa-sys = { version = "0.10", optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
flexaudio-core = { version = "0.3.1", optional = true }
flexaudio-os-linux = { version = "0.3.1", optional = true }
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }

[features]
screenshare = ["dep:ashpd", "dep:pipewire", "dep:libspa-sys", "dep:ffmpeg-next", "dep:flexaudio-core", "dep:flexaudio-os-linux"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "capture_probe"
required-features = ["screenshare"]

[[example]]
name = "encode_probe"
required-features = ["screenshare"]
