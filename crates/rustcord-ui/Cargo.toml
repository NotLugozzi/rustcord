[package]
name = "rustcord-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Discord client written in Rust"

[[bin]]
name = "rustcord"
path = "src/main.rs"

[package.metadata.deb]
name = "rustcord"
maintainer = "RustCord contributors"
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["../../target/release/rustcord", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
name = "rustcord"
assets = [
    { source = "../../target/release/rustcord", dest = "/usr/bin/rustcord", mode = "755" },
]

[dependencies]
rustcord-client = { path = "../rustcord-client" }
emojis = "0.9"
imgui = "0.12"
imgui-winit-support = "0.13"
imgui-wgpu = "0.25"
wgpu = "25"
winit = { version = "0.30", features = ["x11", "wayland"] }
pollster = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
keyring = "4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
cpal = { version = "0.18", optional = true, features = ["pulseaudio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
open = "5"
notify-rust = "4"
chrono = "0.4"
arboard = { version = "3", features = ["wayland-data-control"] }

[features]
default = []
video = ["dep:ffmpeg-next", "dep:cpal"]
